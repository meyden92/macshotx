name: Release

# Publishes a signed, notarized DMG whenever a version tag is pushed.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # macos-26 is required: Package.swift declares .macOS("26.0"), which older
    # runner images cannot build against.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the ancestry check below can resolve origin/main.
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point at a commit on main."
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          # Random per-run password; it never leaves the runner, so there is no
          # reason to carry it as a repository secret.
          keychain_password="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          # Notarization waits can exceed the default 5-minute idle lock, which
          # would make the later codesign of the DMG fail.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that can never be answered.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Write the notarization API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and package
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Building macshot $version"
          ./scripts/release.sh "$version"

      - name: Verify the result
        run: |
          xcrun stapler validate dist/macshot.dmg
          spctl -a -vvv -t open --context context:primary-signature dist/macshot.dmg
          mount_point="$(hdiutil attach dist/macshot.dmg -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)"
          spctl -a -vvv -t exec "$mount_point/macshot.app"
          xcrun stapler validate "$mount_point/macshot.app"
          hdiutil detach "$mount_point" -quiet

      - name: Generate the Sparkle appcast
        # Prereleases get no appcast: the app's SUFeedURL resolves through
        # releases/latest/download, which only ever points at stable releases,
        # so a prerelease appcast would never be served anyway.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Keep this tools version in sync with the Sparkle dependency in
          # Package.swift.
          curl -sSfL -o "$RUNNER_TEMP/sparkle-tools.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$RUNNER_TEMP/sparkle-tools.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"

          key_file="$RUNNER_TEMP/sparkle-ed-private-key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_file"
          # Prints `sparkle:edSignature="..." length="..."`, pasted verbatim
          # into the enclosure below.
          signature="$("$RUNNER_TEMP/sparkle-tools/bin/sign_update" \
            --ed-key-file "$key_file" dist/macshot.dmg)"
          rm -f "$key_file"

          cat > dist/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>macshot</title>
              <item>
                <title>macshot $version</title>
                <link>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}</link>
                <sparkle:version>$version</sparkle:version>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/${GITHUB_REPOSITORY}/releases</sparkle:fullReleaseNotesLink>
                <enclosure
                  url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/macshot-$version.dmg"
                  $signature
                  type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          APPCAST

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Tags carrying a pre-release suffix (v1.0.0-beta.1) ship as drafts of
          # record rather than as the latest stable download.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          mv dist/macshot.dmg "dist/macshot-$version.dmg"
          assets=("dist/macshot-$version.dmg")
          # Stable releases carry the appcast the in-app updater feeds on.
          if [[ -f dist/appcast.xml ]]; then
            assets+=("dist/appcast.xml")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "macshot $version" \
            --generate-notes \
            $prerelease \
            "${assets[@]}"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$KEYCHAIN_PATH" || true
